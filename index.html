<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Utivaro – Free Online Utility Tools</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f7f8fa;
      color:#172033
    }
    header{
      background:#fff;
      border-bottom:1px solid #e5e7eb
    }
    nav{
      max-width:1100px;
      margin:auto;
      padding:20px;

    .logo{

      font-weight:800
    }
    .badge{
      background:#eef2ff;
      padding:8px 12px;
      border-radius:20px;
      font-size:13px
    }
    main{
      max-width:900px;
      margin:auto;
      padding:55px 20px
    }
    .hero{text-align:center}
    h1{
      font-size:44px;
      margin:10px 0
    }
    .hero p{
      color:#667085;
      font-size:18px;
      line-height:1.6
    }
    .tool{
      background:#fff;
      margin-top:45px;
      padding:30px;
      border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.06)
    }
    textarea{
      width:100%;
      min-height:180px;
      padding:15px;
      border:1px solid #d0d5dd;
      border-radius:10px;
      font-size:16px;
      resize:vertical
    }
    .buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:15px 0
    }
    button{
      border:0;
      border-radius:9px;
      padding:12px 18px;
      cursor:pointer;
      font-weight:700
    }
    .primary{
      background:#2563eb;
      color:#fff
    }
    .secondary{
      background:#eef2f6
    }
    .privacy{
      margin-top:18px;
      background:#ecfdf3;
      padding:12px;
      border-radius:8px;
      font-size:14px
    }
    .coming{
      margin-top:50px
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px
    }
    .card{
      background:#fff;
      padding:20px;
      border-radius:12px;
      border:1px solid #eaecf0
    }
    footer{
      text-align:center;
      padding:40px 20px;
      color:#667085
    }
    @media(max-width:650px){
      h1{font-size:34px}
      .grid{grid-template-columns:1fr}
      .tool{padding:20px}
    }
  </style>
</head>
